<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Adaptive UI SDK</title>
<style>body{margin:0;font-family:sans-serif;background:#041018;color:#d7f3ff}
header{padding:16px;background:#032034;border-bottom:1px solid #1ad1ff}
button{background:#12d0ff;border:0;padding:10px 14px;border-radius:8px;font-weight:700}
pre{padding:16px;white-space:pre-wrap}</style></head>
<body><header><h1>Adaptive UI SDK</h1><p>Reusable interface runtime that adapts presentation and interaction to device, task, and context.</p></header>
<main style='padding:16px'><button onclick='proof()'>Run proof</button><pre id='out'>idle</pre></main>
<script>async function proof(){const r=await fetch('/proof',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script>
</body></html>
